<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Konga Clone | Santa Cruz</title>
    <!-- Main CSS -->
    <link rel="stylesheet" href="css/webpage.css">
    <!-- Font Awesome -->
    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>
<body>
    <!-- ===================== NAVIGATION ===================== -->

    <header>
        <nav class="navbar">
            <div class="logo">
                <h2>KONGA</h2>
            </div>
            <div class="search-box">
                <input
                    type="text"
                    id="searchInput"
                    placeholder="Search for products, brands and categories...">
                <button>
                    <i class="fa-solid fa-magnifying-glass"></i>
                </button>
            </div>
            <div class="nav-links">
                <a href="login.html" id="login-link">
                    Login
                </a>
                <a href="signup.html">
                    Sign Up
                </a>
                <a href="#">
                    Help
                </a>
                <a href="cart.html">
                    <i class="fa-solid fa-cart-shopping"></i>
                    Cart
                    <span id="cart-count">0</span>
                </a>
            </div>
        </nav>
    </header>

    <!-- ===================== HERO ===================== -->
    <section class="hero">
        <div class="hero-text">
            <h1>
                Welcome to KONGA
            </h1>
            <p>
                Shop Everything You Love At Amazing Prices.
            </p>
            <button>
                Shop Now
            </button>
        </div>
    </section>

    <!-- ===================== CATEGORIES ===================== -->
    <section class="categories">
        <button class="category-btn" data-category="All">
            All
        </button>
        <button class="category-btn" data-category="Phones">
            Phones
        </button>
        <button class="category-btn" data-category="Laptops">
            Laptops
        </button>
        <button class="category-btn" data-category="Fashion">
            Fashion
        </button>
        <button class="category-btn" data-category="Electronics">
            Electronics
        </button>
        <button class="category-btn" data-category="Gaming">
            Gaming
        </button>
        <button class="category-btn" data-category="Accessories">
            Accessories
        </button>
    </section>
    <!-- ===================== PRODUCTS ===================== -->
    <section>
        <h2 class="title">
            Featured Products
        </h2>
        <div class="sort-container">
            <label for="sortProducts">
                Sort By:
            </label>
            <select id="sortProducts">
                <option value="default">
                    Featured
                </option>
                <option value="low-high">
                    Price: Low to High
                </option>
                <option value="high-low">
                    Price: High to Low
                </option>
                <option value="az">
                    Name: A - Z
                </option>
                <option value="za">
                    Name: Z - A
                </option>
            </select>
        </div>
        <div id="product-container">

            <!-- Products from data.js will appear here -->
        </div>
    </section>
    <!-- ===================== PRODUCT MODAL ===================== -->
    <div id="product-modal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal()">
                &times;
            </span>
            <img
                id="modal-image"
                src=""
                alt="Product Image">
            <h2 id="modal-name"></h2>
            <p id="modal-category"></p>
            <h3 id="modal-price"></h3>
            <p id="modal-description"></p>
            <button id="modal-cart-btn">
                Add To Cart
            </button>
        </div>
    </div>
    <!-- ===================== TOAST ===================== -->
    <div
        id="toast"
        class="toast">
    </div>
    <!-- ===================== FOOTER ===================== -->
    <footer>
        <p>
            &copy; 2026 Konga Clone Project | Santa Cruz
        </p>
    </footer>
    <!-- ===================== JAVASCRIPT ===================== -->
    <script src="js/data.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
